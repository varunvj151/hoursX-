[project]
name = "hoursx"
version = "0.1.0"
description = "HoursX — enterprise autonomous AI agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "llm", "orchestration", "rag", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.0",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "arq>=0.26",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
browser = ["playwright>=1.45"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "reportlab>=4.0",
]

[project.scripts]
hoursx = "hoursx.cli.main:main"

[project.urls]
Documentation = "https://github.com/tedo001/hoursX-/tree/main/docs"
Source = "https://github.com/tedo001/hoursX-"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hoursx = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["src/hoursx"]
branch = true
