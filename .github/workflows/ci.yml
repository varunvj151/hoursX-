name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: console
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Build
        working-directory: console
        run: npm run build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [server, console]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: hoursx-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/console.Dockerfile
          push: false
          tags: hoursx-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
