apiVersion: v1
kind: ConfigMap
metadata:
  name: hoursx-config
data:
  HOURSX_ENVIRONMENT: "production"
  HOURSX_TASK_BACKEND: "arq"
  HOURSX_HOST: "0.0.0.0"
  HOURSX_PORT: "8400"
  HOURSX_LOG_LEVEL: "INFO"
  HOURSX_LOG_JSON: "true"
  HOURSX_WORKSPACE_ROOT: "/var/lib/hoursx/workspaces"
  HOURSX_ALLOW_OPEN_REGISTRATION: "false"
  HOURSX_MAX_RUN_STEPS: "24"
