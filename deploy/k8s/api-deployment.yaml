apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoursx-api
  labels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/OWNER/hoursx-server:latest
          command: ["hoursx", "serve"]
          ports:
            - { name: http, containerPort: 8400 }
          envFrom:
            - configMapRef: { name: hoursx-config }
            - secretRef: { name: hoursx-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: workspaces, mountPath: /var/lib/hoursx/workspaces }
      volumes:
        - name: workspaces
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hoursx-api
spec:
  selector: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 80, targetPort: http }
