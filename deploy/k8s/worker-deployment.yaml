apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoursx-worker
  labels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hoursx, app.kubernetes.io/component: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/OWNER/hoursx-server:latest
          command: ["hoursx", "worker"]
          envFrom:
            - configMapRef: { name: hoursx-config }
            - secretRef: { name: hoursx-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: workspaces, mountPath: /var/lib/hoursx/workspaces }
      volumes:
        - name: workspaces
          emptyDir: {}
